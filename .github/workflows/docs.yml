name: Docs

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cancel superseded runs for the same PR; never cancel runs on the default branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    name: docs-drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Let tfplugindocs invoke `terraform fmt` directly.
          terraform_wrapper: false
      - name: Generate docs
        # tfplugindocs runs through `go tool`, at the version recorded by the tool
        # directive in go.mod.
        env:
          TF_CLI_CONFIG_FILE: ${{ github.workspace }}/.terraformrc.ci
        run: |
          # tfplugindocs schema export uses hashicorp/<provider-name> internally;
          # dev_overrides lets Terraform execute the locally built binary in CI.
          go build -buildvcs=false -o "$(go env GOPATH)/bin/terraform-provider-anecdotes" .
          chmod +x "$(go env GOPATH)/bin/terraform-provider-anecdotes"
          cat > .terraformrc.ci <<EOF
          provider_installation {
            dev_overrides {
              "hashicorp/anecdotes" = "$(go env GOPATH)/bin"
            }
            direct {}
          }
          EOF
          make docs
      - name: Check docs are up to date
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            echo "::error::docs/ is out of date — run 'make docs' and commit the result."
            git --no-pager diff -- docs/
            exit 1
          fi
