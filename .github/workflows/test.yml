name: Provider CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

# Cancel superseded runs for the same PR; never cancel runs on the default branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        # Acceptance tests are skipped without TF_ACC; they require a live tenant.
        run: go test ./... -parallel=4

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned for reproducible CI; bump deliberately, not via "latest".
          version: v2.12.2

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          # Run `terraform fmt` directly without the output wrapper.
          terraform_wrapper: false
      - name: terraform fmt -check
        run: terraform fmt -check -recursive
